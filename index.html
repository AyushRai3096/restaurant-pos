<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- img-src must allow data: URIs, otherwise inline SVG backgrounds
         (used for the dashed table-card outline) are silently blocked. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self' data:; frame-src 'self'" />
    <title>Restaurant POS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer.jsx"></script>
  </body>
</html>
